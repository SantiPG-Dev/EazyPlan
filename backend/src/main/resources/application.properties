# Configuración del servidor
server.port=8080
server.servlet.context-path=/api

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:eazyplan;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2 (desarrollo): http://localhost:8080/api/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clave JWT (en producción usar una variable de entorno)
jwt.secret=eazyplan-secret-key-change-this-in-production-please-0123456789
jwt.expiration-ms=86400000

# Configuración del asistente de IA (opcional)
ai.api-key=
ai.base-url=https://api.openai.com/v1
ai.model=gpt-4o-mini
